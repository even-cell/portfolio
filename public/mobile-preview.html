<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>手机预览 · EVEN ZHANG</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e9e7;color:#222;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:24px 16px}header{width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}h1{font-size:16px;margin:0}p{font-size:12px;color:#666;margin:6px 0 0}button{border:1px solid #ccc;border-radius:8px;background:white;padding:8px 12px;cursor:pointer}.phone{width:414px;max-width:100%;padding:12px;background:#202020;border-radius:42px;box-shadow:0 18px 48px #0003}.screen{height: min(844px,calc(100vh - 132px));min-height:360px;overflow:hidden;border-radius:30px;background:#050505}iframe{display:block;width:100%;height:100%;border:0;background:#050505}.note{max-width:414px;margin-top:16px;line-height:1.6;text-align:center}
</style>
</head>
<body><header><div><h1>手机端预览</h1><p id="size">390 px 宽 · 可滚动浏览</p></div><button id="home" type="button">返回首页</button></header><div class="phone"><div class="screen"><iframe id="preview" src="/" title="作品集手机端预览"></iframe></div></div><p class="note">在手机框内滚动、点击作品，即可查看各页面。</p><script>const frame=document.getElementById('preview');document.getElementById('home').onclick=()=>frame.src='/';new ResizeObserver(()=>document.getElementById('size').textContent=Math.round(frame.clientWidth)+' px 宽 · 可滚动浏览').observe(frame);</script></body>
</html>
